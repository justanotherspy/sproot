name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub release and upload artifacts
  id-token: write   # GitHub OIDC token for cosign keyless signing

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 fetches full tag history, required by GoReleaser for
      # changelog generation and git describe.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on justanotherspy/homebrew-tap so goreleaser
          # can push the generated cask there. The default GITHUB_TOKEN only
          # reaches this repo, so a separate token is required for the tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      # goreleaser publishes the release as a prerelease (.goreleaser.yaml) so the
      # "Latest" badge never points at a release whose binaries and cask are not
      # yet attached. By this step goreleaser has uploaded every artifact, so
      # promote the release: clear the prerelease/draft flags and mark it latest.
      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false \
            --latest
