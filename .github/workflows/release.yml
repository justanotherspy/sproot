name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub release and upload artifacts
  id-token: write   # GitHub OIDC token for cosign keyless signing

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 fetches full tag history, required by GoReleaser for
      # changelog generation and git describe.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on justanotherspy/homebrew-tap so goreleaser
          # can push the generated cask there. The default GITHUB_TOKEN only
          # reaches this repo, so a separate token is required for the tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"

      # goreleaser publishes the release as a prerelease (.goreleaser.yaml) so the
      # "Latest" badge never points at a release whose binaries and cask are not
      # yet attached. By this step goreleaser has uploaded every artifact, so
      # promote the release: clear the prerelease/draft flags and mark it latest.
      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false \
            --latest
