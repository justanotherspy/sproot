name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub release and upload artifacts
  id-token: write   # GitHub OIDC token for cosign keyless signing

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 fetches full tag history, required by GoReleaser for
      # changelog generation and git describe.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
