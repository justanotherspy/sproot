name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create GitHub release and upload artifacts
  id-token: write   # GitHub OIDC token for cosign keyless signing

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 fetches full tag history, required by GoReleaser for
      # changelog generation and git describe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The default GITHUB_TOKEN only reaches this repo, so pushing the cask to
      # justanotherspy/homebrew-tap needs a second credential. Rather than a
      # long-lived PAT, federate this job's OIDC token for a token scoped to the
      # tap alone, valid for the length of the run (the action revokes it in its
      # post step). The grant lives in the tap at
      # .github/chainguard/sproot.sts.yaml and trusts exactly this job's
      # subject, repo:justanotherspy/sproot:environment:release.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: tap-sts
        with:
          scope: justanotherspy/homebrew-tap
          identity: sproot

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Name kept: .goreleaser.yaml templates the cask push token as
          # {{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}. Only the source changed.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-sts.outputs.token }}
          COSIGN_EXPERIMENTAL: "1"

      # goreleaser publishes the release as a prerelease (.goreleaser.yaml) so the
      # "Latest" badge never points at a release whose binaries and cask are not
      # yet attached. By this step goreleaser has uploaded every artifact, so
      # promote the release: clear the prerelease/draft flags and mark it latest.
      - name: Promote release to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --prerelease=false \
            --latest
