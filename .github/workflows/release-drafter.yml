name: release-drafter

# Maintains a rolling draft release. Drafting runs only on push to main:
# each merge updates the next release's notes. goreleaser publishes the
# actual release later when a v* tag is pushed.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    name: update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create and update the draft release
      pull-requests: read  # read merged PRs for the changelog
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
