name: plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-plugin:
    name: validate sproot plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate sproot plugin
        run: claude plugin validate plugins/sproot --strict

  validate-fixtures:
    name: validate converter golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build sproot
        run: go build -o sproot ./cmd/sproot

      - name: validate every expected sproot.yaml fixture
        run: |
          set -euo pipefail
          for f in plugins/sproot/skills/script-convert/examples/*/expected/sproot.yaml; do
            echo "validating $f"
            ./sproot validate --path "$f"
          done
