name: plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-plugin:
    name: validate sproot plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: validate sproot plugin
        run: claude plugin validate plugins/sproot --strict

  validate-fixtures:
    name: validate converter golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build sproot
        run: go build -o sproot ./cmd/sproot

      - name: validate every expected sproot.yaml fixture
        run: |
          set -euo pipefail
          for f in plugins/sproot/skills/script-convert/examples/*/expected/sproot.yaml; do
            echo "validating $f"
            ./sproot validate --path "$f"
          done
