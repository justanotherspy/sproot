name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # Network-free smoke test of the self-update command wiring. The live
      # GitHub API path is covered by unit tests with seams; here we only assert
      # the command is reachable and refuses to self-update a dev build.
      - name: self-update smoke
        env:
          SPROOT_NO_UPDATE_CHECK: "1"
        run: |
          go build -o sproot ./cmd/sproot
          ./sproot self-update --help
          if ./sproot self-update; then
            echo "expected dev build self-update to fail" >&2
            exit 1
          fi

  validate:
    name: validate testdata sproot.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o sproot ./cmd/sproot

      - name: validate flat config
        run: ./sproot validate --path internal/config/testdata/sproot.yaml

      - name: validate multi-target config
        run: ./sproot validate --path internal/config/testdata/sproot_targets.yaml

      # No --path: validate resolves the sproot.yaml from the configured source
      # in ~/.sproot/config.yaml. Use a local source pointing at the checked-out
      # testdata so this stays hermetic (no network).
      - name: validate from configured source (no --path)
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_source: local"
            echo "sproot_config_local_path: $GITHUB_WORKSPACE/internal/config/testdata"
            echo "sproot_config_path: sproot.yaml"
            echo "token_env: SPRITES_TOKEN"
          } > ~/.sproot/config.yaml
          # validate logs to stderr, so merge it into the pipe before grep.
          ./sproot validate 2>&1 | tee /dev/stderr | grep -q "is valid"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest
          install-mode: binary
          # Don't reuse a stale analysis cache across binary/toolchain changes.
          skip-cache: true

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep
        run: semgrep --config auto --error --sarif --sarif-output semgrep.sarif .

      - name: Strip suppressed findings from SARIF
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          path = "semgrep.sarif"
          if not os.path.exists(path):
              raise SystemExit(0)
          with open(path) as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              run["results"] = [r for r in run.get("results", []) if not r.get("suppressions")]
          with open(path, "w") as f:
              json.dump(sarif, f)
          EOF

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
