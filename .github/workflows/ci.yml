name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

  validate:
    name: validate testdata sproot.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o sproot ./cmd/sproot

      - name: validate
        run: ./sproot validate --path internal/config/testdata/sproot.yaml

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
  
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install semgrep
        run: pip install semgrep

      - name: Semgrep
        run: semgrep --config auto --error --sarif --sarif-output semgrep.sarif .

      - name: Strip suppressed findings from SARIF
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          path = "semgrep.sarif"
          if not os.path.exists(path):
              raise SystemExit(0)
          with open(path) as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              run["results"] = [r for r in run.get("results", []) if not r.get("suppressions")]
          with open(path, "w") as f:
              json.dump(sarif, f)
          EOF

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3.35.4
        with:
          sarif_file: semgrep.sarif
