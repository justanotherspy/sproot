name: integration

on:
  pull_request:

# Integration jobs only run for the repo owner; they create real sprites and
# require the SPRITES_TOKEN secret which is not available to other contributors.

permissions:
  contents: read

jobs:
  build:
    name: build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          GOOS=linux GOARCH=amd64 go build -o sproot ./cmd/sproot
          # Ship the retry wrapper alongside the binary so jobs that only
          # download the artifact (no checkout) can still use it.
          cp .github/scripts/retry.sh retry.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sproot-linux-amd64
          path: |
            sproot
            retry.sh
          retention-days: 1

  integration:
    name: test ${{ matrix.name }}
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apt
            only: apt
            config_path: testdata/integration/sproot.yaml
          - name: git-identity
            only: git_identity
            config_path: testdata/integration/sproot.yaml
          - name: file-template
            only: file_template
            config_path: testdata/integration/sproot.yaml
          - name: rc-block
            only: rc_block
            config_path: testdata/integration/sproot.yaml
          - name: claude
            only: claude
            config_path: testdata/integration/sproot.yaml
          - name: cmd
            only: cmd
            config_path: testdata/integration/sproot.yaml
          - name: binary-release
            only: binary_release
            config_path: testdata/integration/sproot_binary.yaml
          - name: uv-tool
            only: uv_tool
            config_path: testdata/integration/sproot_tooling.yaml
          - name: corepack
            only: corepack
            config_path: testdata/integration/sproot_tooling.yaml
          - name: rust-components
            only: rust_components
            config_path: testdata/integration/sproot_tooling.yaml
          - name: go-install
            only: go_install
            config_path: testdata/integration/sproot_tooling.yaml
          - name: cargo-install
            only: cargo_install
            config_path: testdata/integration/sproot_tooling.yaml
          - name: npm
            only: npm
            config_path: testdata/integration/sproot_tooling.yaml
          - name: sprite-service
            only: sprite_service
            config_path: testdata/integration/sproot_tooling.yaml
          - name: shell-completion
            only: shell_completion
            config_path: testdata/integration/sproot_tooling.yaml
          - name: target
            only: cmd
            config_path: testdata/integration/sproot_targets.yaml
            target: web
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          CONFIG_PATH: ${{ matrix.config_path }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: $CONFIG_PATH"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite and run setup
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_ONLY: ${{ matrix.only }}
          MATRIX_TARGET: ${{ matrix.target }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TARGET_FLAG=""
          if [ -n "$MATRIX_TARGET" ]; then
            TARGET_FLAG="--target $MATRIX_TARGET"
          fi
          NAME="spr-${MATRIX_NAME}-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --only "$MATRIX_ONLY" \
              $TARGET_FLAG \
              --skip-console \
              --debug

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          MATRIX_NAME: ${{ matrix.name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-${MATRIX_NAME}-${RUN_ID}-${RUN_ATTEMPT}"

  push-and-outdated:
    name: test push-and-outdated
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-push-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --only cmd \
              --skip-console \
              --debug

      - name: push to sprite
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash retry.sh ./sproot push --name "spr-push-${RUN_ID}-${RUN_ATTEMPT}" --no-checkpoint --only cmd --debug

      - name: check outdated
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-push-${RUN_ID}-${RUN_ATTEMPT}"

  local-config:
    name: test local-config
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config (local source)
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_source: local"
            echo "sproot_config_local_path: $GITHUB_WORKSPACE/testdata/integration"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (local config)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-local-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --only cmd \
              --skip-console \
              --debug

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-local-${RUN_ID}-${RUN_ATTEMPT}"

  push-and-outdated-local:
    name: test push-and-outdated (local config)
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config (local source)
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_source: local"
            echo "sproot_config_local_path: $GITHUB_WORKSPACE/testdata/integration"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (local config)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-pushloc-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --only cmd \
              --skip-console \
              --debug

      - name: push to sprite (local config)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash retry.sh ./sproot push --name "spr-pushloc-${RUN_ID}-${RUN_ATTEMPT}" --no-checkpoint --only cmd --debug

      - name: check outdated (local config)
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-pushloc-${RUN_ID}-${RUN_ATTEMPT}"

  multi-phase:
    name: test multi-phase (no --only)
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot_complex.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (full multi-phase run)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-multi-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --skip-console \
              --skip-verify \
              --debug

      - name: verify labels are current
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: verify post-setup context written
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-multi-${RUN_ID}-${RUN_ATTEMPT}"
          # sproot writes its own summary and must not clobber platform docs.
          ./sproot exec "$NAME" cat /.sprite/docs/sproot-setup.md | tee /dev/stderr | grep "sproot setup summary"
          # The platform's llm.txt is preserved and carries a sproot pointer block.
          ./sproot exec "$NAME" cat /.sprite/llm.txt | tee /dev/stderr | grep "BEGIN SPROOT"
          ./sproot exec "$NAME" cat /.sprite/llm.txt | grep "Sprite Environment"
          ./sproot exec "$NAME" cat /.sprite/docs/agent-context.md | grep "Sprite Environment"

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-multi-${RUN_ID}-${RUN_ATTEMPT}"

  docker-daemon:
    name: test docker daemon.json merge + sprite_service
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot_docker.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (docker + sprite_service)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-docker-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --skip-console \
              --skip-verify \
              --debug

      - name: verify daemon.json merged with overlay2 and dockerd registered
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-docker-${RUN_ID}-${RUN_ATTEMPT}"
          # Use `--` so sproot does not parse the in-sprite command's flags.
          ./sproot exec "$NAME" -- cat /etc/docker/daemon.json | tee /dev/stderr | grep "overlay2"
          ./sproot exec "$NAME" -- sprite-env curl /v1/services/dockerd | tee /dev/stderr | grep -i dockerd

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-docker-${RUN_ID}-${RUN_ATTEMPT}"

  multi-target-full:
    name: test multi-target with extends (no --only)
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot_targets.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (web target, 5-phase extends run)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-mttgt-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --target web \
              --skip-console \
              --skip-verify \
              --debug

      - name: verify labels are current
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-mttgt-${RUN_ID}-${RUN_ATTEMPT}"

  local-config-multi-target:
    name: test local-config + multi-target
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config (local source)
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_source: local"
            echo "sproot_config_local_path: $GITHUB_WORKSPACE/testdata/integration"
            echo "sproot_config_path: sproot_local_targets.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (local config + web target, 4-phase extends run)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-locmt-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --target web \
              --skip-console \
              --skip-verify \
              --debug

      - name: verify labels are current
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-locmt-${RUN_ID}-${RUN_ATTEMPT}"

  push-multi-target:
    name: test push with multi-target
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: https://github.com/$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot_targets.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (web target)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-pushtgt-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --target web \
              --skip-console \
              --skip-verify \
              --debug

      - name: push to sprite (web target)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash retry.sh ./sproot push \
            --name "spr-pushtgt-${RUN_ID}-${RUN_ATTEMPT}" \
            --target web \
            --no-checkpoint \
            --skip-verify \
            --debug

      - name: verify labels still current after push
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-pushtgt-${RUN_ID}-${RUN_ATTEMPT}"

  local-config-multi-phase:
    name: test local-config multi-phase (no --only, flat phases)
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      - name: write host config (local source, complex config)
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_source: local"
            echo "sproot_config_local_path: $GITHUB_WORKSPACE/testdata/integration"
            echo "sproot_config_path: sproot_local_complex.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (5-phase local config run)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-locmp-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --skip-console \
              --skip-verify \
              --debug

      - name: verify labels are current
        run: bash retry.sh bash -c './sproot outdated | tee /dev/stderr | grep "current"'

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-locmp-${RUN_ID}-${RUN_ATTEMPT}"

  config-ssh-url:
    name: test config-repo SSH URL rewrite
    needs: build
    if: github.event.pull_request.user.login == 'justanotherspy'
    runs-on: ubuntu-latest
    env:
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sproot-linux-amd64

      - name: chmod binary
        run: chmod +x sproot

      # Configure the public config repo with its SSH URL. This runner has no SSH
      # key (so the host falls back to HTTPS) and a fresh sprite has none either
      # (so the in-sprite clone rewrites to HTTPS). Bootstrap must still succeed.
      - name: write host config (ssh url)
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p ~/.sproot
          {
            echo "sproot_config_repo: git@github.com:$REPO.git"
            echo "sproot_config_ref: $HEAD_REF"
            echo "sproot_config_path: testdata/integration/sproot.yaml"
            echo "token_env: SPRITES_TOKEN"
            echo "gh_token_env: GITHUB_TOKEN"
          } > ~/.sproot/config.yaml

      - name: create sprite (ssh url rewritten to https)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          NAME="spr-sshurl-${RUN_ID}-${RUN_ATTEMPT}"
          RETRY_CLEANUP="./sproot destroy --force $NAME" bash retry.sh \
            ./sproot new "$NAME" \
              --only cmd \
              --skip-console \
              --debug 2>&1 | tee /tmp/sshurl.log
          # The rewrite warning must appear, proving the SSH->HTTPS path ran.
          grep -q "HTTPS URL" /tmp/sshurl.log

      - name: destroy sprite
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          ./sproot destroy --force "spr-sshurl-${RUN_ID}-${RUN_ATTEMPT}"
