version: 2

project_name: sproot

before:
  hooks:
    - go mod tidy

builds:
  - id: sproot
    main: ./cmd/sproot
    binary: sproot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sproot
    ids:
      - sproot
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

signs:
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum
    env:
      - COSIGN_EXPERIMENTAL=1

homebrew_casks:
  - name: sproot
    ids:
      - sproot
    binaries:
      - sproot
    repository:
      owner: justanotherspy
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/justanotherspy/sproot"
    description: "Bootstrap sprite.dev sprites from a user-owned config repo"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): sproot {{ .Tag }}"
    # The release is created as a prerelease (see release.prerelease below) and
    # only promoted to latest by the workflow after artifacts are attached, so
    # force the cask upload that goreleaser would otherwise skip for prereleases.
    skip_upload: "false"
    # The binary is unsigned, so strip the Gatekeeper quarantine flag on install
    # (macOS only; the cask also serves Homebrew on Linux, which has no xattr).
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sproot"]
          end

release:
  github:
    owner: justanotherspy
    name: sproot
  # Created as a prerelease so the "Latest" badge never points at a release
  # before its binaries (and the Homebrew cask) are attached. The release
  # workflow flips this off and marks the release latest once goreleaser is done.
  prerelease: true
  draft: false
  replace_existing_draft: true
  header: |
    ## sproot {{ .Version }}

    One-line install:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/justanotherspy/sproot/main/install.sh | sh
    ```
  footer: |
    Binaries are signed with [cosign](https://github.com/sigstore/cosign) keyless signing via Sigstore.
    To verify:
    ```sh
    cosign verify-blob \
      --bundle sproot_{{ .Version }}_checksums.txt.sigstore.json \
      sproot_{{ .Version }}_checksums.txt
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
