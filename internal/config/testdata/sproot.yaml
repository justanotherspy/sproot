schema_version: 1

identity:
  git_user_name: "Daniel Schwartz"
  git_user_email: "danielschwar@gmail.com"
  git_default_branch: main
  gh_username: justanotherspy

env:
  - from: MY_GH_TOKEN
    as: GH_TOKEN
    required: true

phases:
  - type: apt
    packages: [shellcheck, jq]
  - type: uv_tool
    tools:
      - name: ruff
      - name: pre-commit
  - type: binary_release
    name: cosign
    repo: sigstore/cosign
    asset: "cosign_{version}_{arch}.deb"
    install: dpkg
  - type: file_template
    src: files/statusline.py
    dest: ~/.claude/statusline.py
    mode: "0755"
  - type: rc_block
    src: files/rc_additions.sh
  - type: repo_clone
    base_dir: ~/repos
    repos:
      - justanotherspy/garlic
      - justanotherspy/poker
  - type: corepack
    managers: [pnpm, yarn]
  - type: rust_components
    components: [clippy, rustfmt, rust-analyzer]
  - type: docker
  - type: go_install
    tools:
      - pkg: golang.org/x/tools/cmd/goimports
        version: latest
  - type: cargo_install
    tools:
      - name: ripgrep
      - name: cargo-nextest
        version: "0.9.72"
        locked: true
  - type: sprite_service
    service: dockerd
    cmd: /usr/bin/dockerd
  - type: git_identity
  - type: ssh_setup
  - type: gh_token
  - type: claude
    settings:
      theme: dark
  - type: cmd
    run: "echo hello"
    check: "true"
    name: "echo-hello"
  - type: nix
    packages:
      - hello
      - name: ripgrep
        bin: rg
      - name: nixfmt
        flake: "nixpkgs#nixfmt-rfc-style"
        bin: nixfmt
    setup_script: files/nix-setup.sh
    daemon_service: true
